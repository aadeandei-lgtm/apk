name: Run APK Patcher
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: URL APK
        required: true
      flags:
        description: 'Flags APK_PATCHER (contoh: --ads --crc)'
        required: false
        default: '--ads --crc'
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install apktool + build-tools
        run: |
          curl -sLo /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          sudo tee /usr/local/bin/apktool >/dev/null <<'EOF'
          #!/bin/bash
          exec java -jar /tmp/apktool.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
      - name: Download APK
        run: |
          curl -sL --retry 3 -o app.apk "${{ inputs.apk_url }}"
          file app.apk; ls -la app.apk
      - name: Run patcher
        continue-on-error: true
        run: |
          python3 APK_PATCHER.py -i app.apk -o patched ${{ inputs.flags }} -v
          echo '--- hasil ---'
          find patched -maxdepth 3 | head -60 || true
      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-output
          path: patched/
