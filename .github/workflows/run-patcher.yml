name: Run APK Patcher
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: URL APK
        required: true
      flags:
        description: Flags APK_PATCHER
        required: false
        default: --ads --crc
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fix struktur + tooling
        run: |
          ln -sfn PATCH Patch
          ZA=$(find $ANDROID_HOME/build-tools -name zipalign -type f 2>/dev/null | sort | tail -1)
          if [ -n "$ZA" ]; then sudo ln -sf "$ZA" /usr/local/bin/zipalign; echo zipalign-ok; fi
          curl -sLo /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          printf '#!/bin/bash\nexec java -jar /tmp/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
      - name: Download APK
        run: |
          curl -sL --retry 3 -o app.apk '${{ inputs.apk_url }}'
          file app.apk
          ls -la app.apk
      - name: Run patcher
        run: |
          python3 APK_PATCHER.py -i app.apk -o patched ${{ inputs.flags }} -v
          echo hasil:
          ls -la patched/ || true
      - name: KPN MainActivity stub (banner creation path)
        run: |
          apktool d -f -q patched/patched_app.apk -o dec_k
          python3 Utils/kpn_adpath.py dec_k || true
          apktool b -q dec_k -o patched/patched_app2.apk
          ls -la patched/
      - name: Native signature-check bypass
        run: |
          pip3 install --quiet pyelftools capstone || pip install --quiet pyelftools capstone
          python3 Utils/native_sig_bypass.py patched/patched_app2.apk patched/patched_nb.apk 2>/dev/null || python3 Utils/native_sig_bypass.py patched/patched_app2.apk patched/patched_nb.apk
          ls -la patched/
      - name: Re-sign (zipalign + apksigner v1+v2+v3)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 patched/patched_nb.apk patched/aligned.apk
          keytool -genkeypair -v -keystore ks.jks -alias patcher -storepass patchpass -keypass patchpass -dname "CN=APKPatcher" -keyalg RSA -keysize 2048 -validity 3650 >/dev/null 2>&1
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:patchpass --v2-signing-enabled true --v3-signing-enabled true patched/aligned.apk
          mv patched/aligned.apk patched/patched_signed.apk
          "$BT/apksigner" verify --print-certs patched/patched_signed.apk | head -5
          ls -la patched/
      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-output
          path: patched/
